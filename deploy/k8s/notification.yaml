apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: carflow
spec:
  replicas: 2
  selector: {matchLabels: {app: notification}}
  template:
    metadata:
      labels: {app: notification}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000"}
    spec:
      imagePullSecrets: [{name: ghcr-pull}]
      containers:
        - name: notification
          image: ghcr.io/${GHCR_USER}/carflow-notification:${IMAGE_TAG}
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: carflow-config}}]
          env:
            - {name: SERVICE_NAME, value: notification}
            - {name: DATABASE_URL, value: "postgresql+asyncpg://carflow:carflow@postgres:5432/notification"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: 8000}, initialDelaySeconds: 5, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: carflow
spec:
  selector: {app: notification}
  ports: [{port: 8000, targetPort: 8000}]
