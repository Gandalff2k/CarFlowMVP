# A Service with no selector + a matching Endpoints object lets in-cluster
# code address the infra VM's datastores by the exact same hostnames
# docker-compose already uses locally (postgres, redis, mongo, elasticsearch,
# kafka) — no env-var rewriting needed beyond what configmap.yaml already
# does for KAFKA_BOOTSTRAP_SERVERS (port differs: 9092 EXTERNAL, not the
# docker-internal 29092 PLAINTEXT listener — see docker-compose.yml's
# KAFKA_EXTERNAL_ADVERTISED_HOST note). ${INFRA_PRIVATE_IP} is substituted
# by deploy.sh's envsubst pass over the whole rendered manifest stream.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: carflow
spec:
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres
  namespace: carflow
subsets:
  - addresses: [{ip: "${INFRA_PRIVATE_IP}"}]
    ports: [{port: 5432}]
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: carflow
spec:
  ports: [{port: 9092, targetPort: 9092}]
---
apiVersion: v1
kind: Endpoints
metadata:
  name: kafka
  namespace: carflow
subsets:
  - addresses: [{ip: "${INFRA_PRIVATE_IP}"}]
    ports: [{port: 9092}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: carflow
spec:
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: v1
kind: Endpoints
metadata:
  name: redis
  namespace: carflow
subsets:
  - addresses: [{ip: "${INFRA_PRIVATE_IP}"}]
    ports: [{port: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: carflow
spec:
  ports: [{port: 27017, targetPort: 27017}]
---
apiVersion: v1
kind: Endpoints
metadata:
  name: mongo
  namespace: carflow
subsets:
  - addresses: [{ip: "${INFRA_PRIVATE_IP}"}]
    ports: [{port: 27017}]
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: carflow
spec:
  ports: [{port: 9200, targetPort: 9200}]
---
apiVersion: v1
kind: Endpoints
metadata:
  name: elasticsearch
  namespace: carflow
subsets:
  - addresses: [{ip: "${INFRA_PRIVATE_IP}"}]
    ports: [{port: 9200}]
