apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry
  namespace: carflow
spec:
  replicas: 2   
  selector: {matchLabels: {app: telemetry}}
  template:
    metadata:
      labels: {app: telemetry}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000"}
    spec:
      containers:
        - name: telemetry
          image: ghcr.io/${GHCR_USER}/carflow-telemetry:${IMAGE_TAG}
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: carflow-config}}]
          env:
            - {name: SERVICE_NAME, value: telemetry}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: carflow-secrets, key: JWT_SECRET}}
          resources:
            requests: {cpu: 150m, memory: 192Mi}
            limits: {cpu: 750m, memory: 384Mi}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: 8000}, initialDelaySeconds: 5, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry
  namespace: carflow
spec:
  selector: {app: telemetry}
  ports: [{port: 8000, targetPort: 8000}]
