apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: carflow
spec:
  replicas: 2
  selector: {matchLabels: {app: search}}
  template:
    metadata:
      labels: {app: search}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000"}
    spec:
      imagePullSecrets: [{name: ghcr-pull}]
      containers:
        - name: search
          image: ghcr.io/${GHCR_USER}/carflow-search:${IMAGE_TAG}
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: carflow-config}}]
          env:
            - {name: SERVICE_NAME, value: search}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: carflow-secrets, key: JWT_SECRET}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: 8000}, initialDelaySeconds: 5, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: search
  namespace: carflow
spec:
  selector: {app: search}
  ports: [{port: 8000, targetPort: 8000}]
