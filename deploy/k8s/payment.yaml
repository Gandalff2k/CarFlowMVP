apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: carflow
spec:
  replicas: 2
  selector: {matchLabels: {app: payment}}
  template:
    metadata:
      labels: {app: payment}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000"}
    spec:
      imagePullSecrets: [{name: ghcr-pull}]
      containers:
        - name: payment
          image: ghcr.io/${GHCR_USER}/carflow-payment:${IMAGE_TAG}
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: carflow-config}}]
          env:
            - {name: SERVICE_NAME, value: payment}
            - {name: DATABASE_URL, value: "postgresql+asyncpg://carflow:carflow@postgres:5432/payment"}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: carflow-secrets, key: JWT_SECRET}}
            - name: STRIPE_API_KEY
              valueFrom: {secretKeyRef: {name: carflow-secrets, key: STRIPE_API_KEY, optional: true}}
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom: {secretKeyRef: {name: carflow-secrets, key: STRIPE_WEBHOOK_SECRET, optional: true}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: 8000}, initialDelaySeconds: 5, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: carflow
spec:
  selector: {app: payment}
  ports: [{port: 8000, targetPort: 8000}]
