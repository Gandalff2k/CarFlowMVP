# otel-collector's ConfigMap, Kong's declarative config, and Grafana's
# datasource/dashboard-provider/dashboard ConfigMaps are NOT defined here —
# deploy.sh creates them straight from the real files this repo already
# uses locally (infra/otel-collector-config.yml, infra/kong.yml,
# infra/grafana/**) via `kubectl create configmap --from-file`, so there is
# exactly one copy of each to keep in sync.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: carflow
spec:
  replicas: 1
  selector: {matchLabels: {app: otel-collector}}
  template:
    metadata: {labels: {app: otel-collector}}
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.108.0
          args: ["--config=/etc/otelcol-contrib/config.yml"]
          ports: [{containerPort: 4317}, {containerPort: 4318}]
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol-contrib}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: config
          configMap: {name: otel-collector-config}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: carflow
spec:
  selector: {app: otel-collector}
  ports: [{name: grpc, port: 4317}, {name: http, port: 4318}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: carflow
spec:
  replicas: 1
  selector: {matchLabels: {app: jaeger}}
  template:
    metadata: {labels: {app: jaeger}}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env: [{name: COLLECTOR_OTLP_ENABLED, value: "true"}]
          ports: [{containerPort: 4317}, {containerPort: 16686}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: carflow
spec:
  selector: {app: jaeger}
  ports: [{name: otlp-grpc, port: 4317}, {name: ui, port: 16686}]
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
  namespace: carflow
spec:
  type: NodePort
  selector: {app: jaeger}
  ports: [{port: 16686, targetPort: 16686, nodePort: 30686}]
---
# Prometheus needs cluster-scoped read access to discover pods by
# annotation (kubernetes_sd_configs below) — this is the one piece of
# real RBAC this deployment needs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: carflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: carflow-prometheus
rules:
  - apiGroups: [""]
    resources: [pods, nodes, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: carflow-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: carflow
roleRef: {kind: ClusterRole, name: carflow-prometheus, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: carflow
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [carflow]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: k8s_app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: carflow
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: carflow
spec:
  selector: {app: prometheus}
  ports: [{port: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: carflow
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.2
          ports: [{containerPort: 3000}]
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: dashboard-providers, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards, mountPath: /etc/grafana/carflow-dashboards}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: dashboard-providers
          configMap: {name: grafana-dashboard-providers}
        - name: dashboards
          configMap: {name: grafana-dashboards}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: carflow
spec:
  type: NodePort
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000, nodePort: 30300}]
