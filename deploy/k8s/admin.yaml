apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: carflow
spec:
  replicas: 1   # thin facade, low traffic by design (see CLAUDE.md scope) — no need for more
  selector: {matchLabels: {app: admin}}
  template:
    metadata:
      labels: {app: admin}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000"}
    spec:
      containers:
        - name: admin
          image: ghcr.io/${GHCR_USER}/carflow-admin:${IMAGE_TAG}
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: carflow-config}}]
          env:
            - {name: SERVICE_NAME, value: admin}
            - {name: DATABASE_URL, value: "postgresql+asyncpg://carflow:carflow@postgres:5432/admin"}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: carflow-secrets, key: JWT_SECRET}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: 8000}, initialDelaySeconds: 5, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: carflow
spec:
  selector: {app: admin}
  ports: [{port: 8000, targetPort: 8000}]
