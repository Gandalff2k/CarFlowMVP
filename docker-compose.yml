services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: carflow
      POSTGRES_PASSWORD: carflow
      POSTGRES_DB: carflow
    ports: ["5432:5432"]
    volumes: ["./infra/sql/init:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carflow -d carflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  debezium:
    image: debezium/connect:2.7.3.Final
    ports: ["8083:8083"]
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Without this, the worker's default JsonConverter wraps every message
      # in a {"schema": ..., "payload": ...} envelope (with the outbox row's
      # own payload re-serialized as an escaped JSON string inside it), which
      # is not what our consumers expect: they read the Kafka message value
      # as the bare envelope JSON written by shared/outbox.py.
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes: ["./infra/otel-collector-config.yml:/etc/otelcol-contrib/config.yml:ro"]
    ports: ["4317:4317", "4318:4318"]
    depends_on:
      jaeger: {condition: service_healthy}

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on:
      hello: {condition: service_healthy}
      auth: {condition: service_healthy}
      listing: {condition: service_healthy}
      booking: {condition: service_healthy}
      payment: {condition: service_healthy}
      search: {condition: service_healthy}
      telemetry: {condition: service_healthy}
      admin: {condition: service_healthy}
      notification: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.2.2
    ports: ["3000:3000"]
    volumes:
      - "./infra/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./infra/grafana/dashboards:/etc/grafana/carflow-dashboards:ro"
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  hello:
    build:
      context: .
      dockerfile: services/hello/Dockerfile
    ports: ["8000:8000"]
    environment:
      SERVICE_NAME: hello
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports: ["8001:8000"]
    environment:
      SERVICE_NAME: auth
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DATABASE_URL: postgresql+asyncpg://carflow:carflow@postgres:5432/auth
      JWT_SECRET: dev-secret
      JWT_ISSUER: carflow-auth
    depends_on:
      postgres: {condition: service_healthy}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  listing:
    build:
      context: .
      dockerfile: services/listing/Dockerfile
    ports: ["8002:8000"]
    environment:
      SERVICE_NAME: listing
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DATABASE_URL: postgresql+asyncpg://carflow:carflow@postgres:5432/listing
      JWT_SECRET: dev-secret
      JWT_ISSUER: carflow-auth
    depends_on:
      postgres: {condition: service_healthy}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  booking:
    build:
      context: .
      dockerfile: services/booking/Dockerfile
    ports: ["8003:8000"]
    environment:
      SERVICE_NAME: booking
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DATABASE_URL: postgresql+asyncpg://carflow:carflow@postgres:5432/booking
      JWT_SECRET: dev-secret
      JWT_ISSUER: carflow-auth
      LISTING_BASE_URL: http://listing:8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      listing: {condition: service_healthy}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  payment:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    ports: ["8004:8000"]
    environment:
      SERVICE_NAME: payment
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DATABASE_URL: postgresql+asyncpg://carflow:carflow@postgres:5432/payment
      JWT_SECRET: dev-secret
      JWT_ISSUER: carflow-auth
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  search:
    build:
      context: .
      dockerfile: services/search/Dockerfile
    ports: ["8005:8000"]
    environment:
      SERVICE_NAME: search
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LISTING_BASE_URL: http://listing:8000
      JWT_SECRET: dev-secret
      JWT_ISSUER: carflow-auth
    depends_on:
      elasticsearch: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      listing: {condition: service_healthy}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  telemetry:
    build:
      context: .
      dockerfile: services/telemetry/Dockerfile
    ports: ["8006:8000"]
    environment:
      SERVICE_NAME: telemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret
      JWT_ISSUER: carflow-auth
    depends_on:
      kafka: {condition: service_healthy}
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  admin:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    ports: ["8007:8000"]
    environment:
      SERVICE_NAME: admin
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DATABASE_URL: postgresql+asyncpg://carflow:carflow@postgres:5432/admin
      JWT_SECRET: dev-secret
      JWT_ISSUER: carflow-auth
      LISTING_BASE_URL: http://listing:8000
      BOOKING_BASE_URL: http://booking:8000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      listing: {condition: service_healthy}
      booking: {condition: service_healthy}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    ports: ["8008:8000"]
    environment:
      SERVICE_NAME: notification
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DATABASE_URL: postgresql+asyncpg://carflow:carflow@postgres:5432/notification
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  kong:
    image: kong:3.8
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes: ["./infra/kong.yml:/kong/declarative/kong.yml:ro"]
    ports: ["8080:8000", "8443:8443", "8444:8001"]
    depends_on:
      auth: {condition: service_healthy}
      listing: {condition: service_healthy}
      booking: {condition: service_healthy}
      payment: {condition: service_healthy}
      search: {condition: service_healthy}
      telemetry: {condition: service_healthy}
      admin: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    # Manual test console (web/index.html) — a hand-rolled static page, not a
    # product UI. Served over http:// rather than opened as a file:// URL so
    # WebSocket/fetch calls to Kong behave the same as a real browser client.
    image: nginx:alpine
    ports: ["8090:80"]
    volumes: ["./web:/usr/share/nginx/html:ro"]
    depends_on:
      kong: {condition: service_healthy}