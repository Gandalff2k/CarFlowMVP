    static_configs:
      - targets: [hello:8000]
  - job_name: auth
    static_configs:
      - targets: [auth:8000]
  - job_name: listing
    static_configs:
      - targets: [listing:8000]
  - job_name: booking
    static_configs:
      - targets: [booking:8000]
  - job_name: payment
    static_configs:
      - targets: [payment:8000]
  - job_name: search
    static_configs:
      - targets: [search:8000]
